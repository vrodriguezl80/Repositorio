name: Orders API CI/CD

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

jobs:

  test:
    name: Stage 1 - Lint / Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: Ejercicio-1
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn pytest httpx

      - name: Run tests
        working-directory: Ejercicio-1
        run: pytest


  security:
    name: Stage 2 - Security Scan
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build image for security scan
        run: docker build -t orders-api:scan ./Ejercicio-1

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: orders-api:scan
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH


  build:
    name: Stage 3 - Build & Push
    runs-on: ubuntu-latest
    needs: security

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./Ejercicio-1
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/orders-api:${{ github.sha }}


  deploy:
    name: Stage 4 - Deploy Simulado
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Simulate Kubernetes deployment
        run: |
          echo "Starting simulated deployment..."
          echo "Updating Deployment orders-api"
          echo "New image:"
          echo "ghcr.io/${{ github.repository_owner }}/orders-api:${{ github.sha }}"
          echo "kubectl set image deployment/orders-api orders-api=ghcr.io/${{ github.repository_owner }}/orders-api:${{ github.sha }}"
          echo "Deployment simulation completed successfully."